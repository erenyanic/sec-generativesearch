[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sec-generative-search"
version = "0.1.0"
description = "RAG system for SEC filings (10-K, 10-Q, 8-K and amended variants) with grounded financial analysis and citations."
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Eren Yanic" },
]
readme = "README.md"

# Core runtime dependencies — every deployment needs these.
#
# Lower bounds only (no upper caps) — we track the latest stable releases
# to pick up security patches and provider-SDK updates promptly.  The
# minimums document the oldest version known to work; CI always installs
# the newest compatible release and is the authoritative compatibility
# check.  Resolved versions are captured in the lockfile for reproducibility.
dependencies = [
    # Configuration and validation
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "python-dotenv>=1.0",

    # SEC data retrieval
    "edgartools>=5.0",

    # HTML parsing
    "doc2dict>=0.5",

    # Vector store and metadata
    "chromadb>=1.0",

    # API framework
    # ``!=0.136.3`` excludes the single compromised release flagged by
    # MAL-2026-4750 (osv.dev malicious-package advisory). Drop the
    # exclusion once upstream publishes a known-good replacement and
    # the advisory is withdrawn.
    "fastapi>=0.115,!=0.136.3",
    "uvicorn[standard]>=0.34",

    # CLI
    "typer>=0.15",
    "rich>=14.0",

    # HTTP client (used by provider adapters and test client)
    "httpx>=0.28",

    # LLM providers. `openai` is the canonical SDK for OpenAI itself
    # and every OpenAI-compatible vendor (Mistral, Kimi, DeepSeek,
    # Qwen, OpenRouter). `tiktoken` powers exact
    # token counting and cost accounting; treating it as a hard dep keeps
    # the price surface honest instead of silently degrading to
    # whitespace heuristics.
    "openai>=1",
    "tiktoken>=0.7",

    # Anthropic and Google Gemini first-party SDKs. Each vendor has a
    # deliberately distinct exception hierarchy and
    # streaming shape, so we do not route them through the OpenAI wire
    # protocol; they get their own adapters in ``providers/anthropic.py``
    # and ``providers/gemini.py`` and plug into the same
    # :func:`resilient_call` contract as every other provider.
    "anthropic>=0.39",
    "google-genai>=0.3",
]

[project.optional-dependencies]
# SQLCipher encryption support — requires system-level sqlcipher library.
encryption = [
    "pysqlcipher3>=1.2",
]

# Local embedding provider. Pulls torch + sentence-transformers
# (~2 GB install) — kept optional so cloud deployments that rely on hosted
# embedding APIs (OpenAI, Gemini, Mistral, Qwen) do not carry the payload.
# Install with: `uv pip install -e ".[local-embeddings]"`.
local-embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]

# In-process metrics registry + OpenMetrics exposition for the
# admin-gated ``GET /api/metrics`` endpoint. Kept optional so
# Scenario-A local runs that never scrape carry no extra payload;
# ``core/metrics.py`` degrades to a no-op recorder when the extra is
# absent and the endpoint returns ``503 metrics_unavailable``.
# Install with: `uv pip install -e ".[metrics]"`.
metrics = [
    "prometheus-client>=0.20",
]

# Development tools — linting, formatting, pre-commit hooks.
dev = [
    "ruff>=0.11",
    "pre-commit>=4.3",
]

# Testing framework — pytest, coverage, and async test utilities.
test = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pytest-asyncio>=1.0",
    "coverage[toml]>=7.10",
]

[project.scripts]
sec-rag = "sec_generative_search.cli.main:main"

# ---------------------------------------------------------------------------
# Ruff — linter and formatter configuration
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

# Exclude modules that are migrated from SEC-SemanticSearch but not yet
# adapted for the current generative-search code style. Each entry is
# removed from this list once the module is brought up to the same lint
# standard as the rest of the project.
extend-exclude = []

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no print() in library code)
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "S101",   # assert is fine in tests
    "S105",   # possible hardcoded password — too many false positives on constants
    "T201",   # print() allowed in CLI modules
    "A005",   # module shadowing a Python built-in module (logging.py)
    "UP035",  # deprecated typing imports — pydantic still uses them
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "T201"]  # asserts, hardcoded passwords, prints OK in tests
"src/sec_generative_search/cli/**/*.py" = ["T201"]  # CLI modules may print
# B008 = "do not call function in argument defaults" — clashes with the
# canonical FastAPI Depends(...) / Security(...) pattern used in routes.
"src/sec_generative_search/api/**/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["sec_generative_search"]

# ---------------------------------------------------------------------------
# pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",          # show summary of all non-passing tests
    "--strict-markers",
    "--strict-config",
    "-q",           # quiet by default; CI can override with -v
    # Load / throughput tests run many iterations and concurrent fan-outs;
    # they are opt-in.  A later ``-m`` on the command line overrides this
    # (pytest keeps the last ``-m``), so ``pytest -m load`` runs only them.
    "-m", "not load",
]
markers = [
    "slow: marks tests that are slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
    "security: marks security-focused test cases",
    "load: marks load / throughput tests (opt-in; deselected by default, run with '-m load')",
]

# ---------------------------------------------------------------------------
# coverage configuration
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["sec_generative_search"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
]
