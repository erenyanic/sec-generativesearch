name: Dependency audit (scheduled)

# Weekly CVE audit of the API release image's hash-pinned lock
# (deploy/requirements.txt, F26). ci.yml audits the same file on every push and
# PR, but a pinned lock never changes by itself: an advisory published against a
# pinned version would otherwise surface only on the next commit. This workflow
# re-runs the ci.yml lock audit on a clock, so a newly-vulnerable pin turns red
# within a week even while nothing is being committed. The fix is a lock refresh
# (the command is the lock's own header).
#
# Deliberately NOT named "CI": deploy.yml triggers on workflow_run of "CI", and a
# scheduled run must never deploy. Read-only token, no GCP credentials, actions
# pinned by full commit SHA, no event data interpolated into a `run:` block.
#
# GitHub disables scheduled workflows in a repository with no activity for 60
# days; re-enable it from the Actions tab if it goes quiet.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-audit:
    name: pip-audit (API image lock)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install "pip-audit>=2.7"

      - name: Audit the API release-image lock
        # Same command and reviewed ignore set as the ci.yml lock-audit step;
        # the justification for each ignored chromadb advisory lives there.
        run: |
          python -m pip_audit -r deploy/requirements.txt --disable-pip \
            --ignore-vuln CVE-2026-45829 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833
